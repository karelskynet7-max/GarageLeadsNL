[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "garageleadsnl"
version = "0.1.0"
description = "GDPR-compliant lead monitoring for Dutch auto repair businesses"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27.0",
  "feedparser>=6.0.11",
  "pydantic>=2.7.0",
  "APScheduler>=3.10.4",
  "python-dotenv>=1.0.1",
  "PyYAML>=6.0.0",
  "fastapi>=0.111.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = ["garageleads", "garageleads.adapters"]
