version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: garageleadsnl
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - garageleads_data:/data
    environment:
      DATA_DIR: /data
    healthcheck:
      test: ["CMD", "python", "-m", "garageleads", "--help"]
      interval: 30s
      timeout: 10s
      retries: 3
    command: ["python", "-m", "garageleads", "run"]

volumes:
  garageleads_data:
